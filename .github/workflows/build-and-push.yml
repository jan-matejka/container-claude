name: Build and push image

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claude

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image repository
        id: repo
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # The default buildx "docker" driver builder can't export a build
      # cache to a registry; switch to the docker-container driver so
      # cache_to/cache_from type=registry (set in compose.ci.yaml) works.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          CACHE_IMAGE: ${{ steps.repo.outputs.image }}:buildcache
        run: docker compose -f compose.yaml -f compose.ci.yaml build

      - name: Tag and push image
        env:
          IMAGE: ${{ steps.repo.outputs.image }}
          GIT_SHA: ${{ github.sha }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu
          docker tag claude:latest "${IMAGE}:${GIT_SHA}"
          docker push "${IMAGE}:${GIT_SHA}"

          if [ "${IS_MAIN}" = "true" ]; then
            docker push "${IMAGE}:latest"
          fi
